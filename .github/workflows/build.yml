name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libstdc++6 \
          openjdk-17-jdk \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config

    - name: Install Buildozer
      run: pip install --user --upgrade buildozer cython==0.29.33

    - name: Initialize Buildozer config
      run: |
        buildozer init || true
        
        # Force l'acceptation des licences et l'API stable pour éviter le blocage aidl
        sed -i 's/#\?android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/#\?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/#\?android.minapi =.*/android.minapi = 21/' buildozer.spec
        sed -i 's/#\?android.sdk =.*/android.sdk = 33/' buildozer.spec
        
        sed -i 's/#\?requirements =.*/requirements = python3,kivy,pygame/' buildozer.spec
        sed -i 's/#\?package.name =.*/package.name = jascoserpent/' buildozer.spec
        sed -i 's/#\?package.domain =.*/package.domain = org.jasco/' buildozer.spec
        sed -i 's/#\?title =.*/title = JASCO SERPENT/' buildozer.spec

    - name: Build APK with Buildozer
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
